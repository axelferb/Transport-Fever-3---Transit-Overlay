name: Move tag

# Points an existing tag at another commit (for example after rewriting history).
# The release that uses the tag stays as it is.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to move, e.g. v2.10.0
        required: true
      commit:
        description: Commit it should point to
        required: true

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move the tag
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          sha=$(git rev-parse --verify "$COMMIT^{commit}")
          echo "$TAG: $(git rev-parse "$TAG^{commit}" 2>/dev/null || echo none) -> $sha"
          git tag -f "$TAG" "$sha"
          git push -f origin "refs/tags/$TAG"
