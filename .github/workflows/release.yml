name: Release

# Builds the desktop app for Windows (portable exe) and Linux (AppImage), zips the mod,
# and publishes all three as a GitHub release.
# Run it from the Actions tab (Run workflow), or push a tag like v2.5.2.
# File names carry no version, so these links always point to the newest release:
#   https://github.com/axelferb/Transport-Fever-3---Transit-Overlay/releases/latest/download/TransitOverlay-portable.exe
#   https://github.com/axelferb/Transport-Fever-3---Transit-Overlay/releases/latest/download/TransitOverlay-linux-x86_64.AppImage
# The release version comes from desktop/package.json; the notes come from that version's section in CHANGELOG.md.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win portable
          - os: ubuntu-latest
            target: --linux AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build the app
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check the mod revision matches everywhere
        run: |
          json=$(node -p "require('./mod/transit_overlay/mod.json').revision")
          lua=$(grep -o 'TFO|BEGIN|1|mod:[0-9]*' mod/transit_overlay/content/transit_overlay/export.lua | cut -d: -f2)
          app=$(grep -o 'MOD_REVISION = [0-9]*' desktop/app/index.html | grep -o '[0-9]*$')
          echo "mod.json $json, export.lua $lua, app $app"
          [ "$json" = "$lua" ] && [ "$json" = "$app" ] || { echo "::error::Mod revision differs: mod.json $json, export.lua $lua, app $app"; exit 1; }

      - name: Release notes from CHANGELOG.md
        run: |
          v=${{ steps.version.outputs.version }}
          awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/./,$!d' > changes.md
          [ -s changes.md ] || { echo "::error::CHANGELOG.md has no section '## $v'"; exit 1; }
          { echo "## What's new"; echo; cat changes.md; echo; echo "## Downloads"; echo; cat .github/release-footer.md; } > notes.md
          cat notes.md

      - name: Zip the mod
        run: cd mod && zip -qr ../dist/transit_overlay-mod.zip transit_overlay

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Transit Overlay ${{ steps.version.outputs.version }}
          files: |
            dist/TransitOverlay-portable.exe
            dist/TransitOverlay-linux-x86_64.AppImage
            dist/transit_overlay-mod.zip
          body_path: notes.md
