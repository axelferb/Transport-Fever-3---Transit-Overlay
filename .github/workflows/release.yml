name: Release

# Builds the desktop app for Windows (portable exe) and Linux (AppImage), zips the mod,
# and publishes all three as a GitHub release.
# Run it from the Actions tab (Run workflow), or push a tag like v2.5.2.
# File names carry no version, so these links always point to the newest release:
#   https://github.com/axelferb/Transport-Fever-3---Transit-Overlay/releases/latest/download/TransitOverlay-portable.exe
#   https://github.com/axelferb/Transport-Fever-3---Transit-Overlay/releases/latest/download/TransitOverlay-linux-x86_64.AppImage
# The release version comes from desktop/package.json.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win portable
          - os: ubuntu-latest
            target: --linux AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build the app
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Zip the mod
        run: cd mod && zip -qr ../dist/transit_overlay-mod.zip transit_overlay

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Transit Overlay ${{ steps.version.outputs.version }}
          files: |
            dist/TransitOverlay-portable.exe
            dist/TransitOverlay-linux-x86_64.AppImage
            dist/transit_overlay-mod.zip
          body: |
            - **TransitOverlay-portable.exe**: the desktop app for Windows. Run it, no install needed. Windows SmartScreen may warn because it isn't signed: More info → Run anyway.
            - **TransitOverlay-linux-x86_64.AppImage**: the desktop app for Linux. Make it executable (`chmod +x`) and run it.
            - **transit_overlay-mod.zip**: the in-game button, for installing by hand. Most players should subscribe on [mod.io](https://mod.io/g/transportfever3/m/transit-overlay) instead.

            Click the Transit Overlay button at the top left of the game screen; the app updates within a couple of seconds.
